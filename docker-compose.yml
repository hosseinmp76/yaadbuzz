services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yaadbuzz
      POSTGRES_USER: ${POSTGRES_USER:-yaadbuzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yaadbuzz}
    # Localhost-only so `./mvnw quarkus:dev` can connect without exposing DB to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaadbuzz -d yaadbuzz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yaadbuzz}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-yaadbuzzsecret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yaadbuzz}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-yaadbuzzsecret}
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mc mb --ignore-existing local/yaadbuzz;
      mc anonymous set download local/yaadbuzz;
      exit 0;
      "

  app:
    # Default: build locally and tag as yaadbuzz/yaadbuzz:local.
    # Use a Hub image instead (no --build):
    #   APP_IMAGE=youruser/yaadbuzz:latest APP_PULL_POLICY=always docker compose up -d
    # Build locally:
    #   APP_PULL_POLICY=build docker compose up -d --build
    #   # or simply: docker compose up -d --build
    image: ${APP_IMAGE:-hosseinmp762/yaadbuzz}:${IMAGE_TAG:-2026.07.30.5}
    pull_policy: ${APP_PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.compose
      tags:
        - ${APP_IMAGE:-yaadbuzz/yaadbuzz}:${IMAGE_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/yaadbuzz
      QUARKUS_DATASOURCE_USERNAME: ${QUARKUS_DATASOURCE_USERNAME:-yaadbuzz}
      QUARKUS_DATASOURCE_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD:-yaadbuzz}
      QUARKUS_HIBERNATE_SEARCH_ORM_ELASTICSEARCH_HOSTS: elasticsearch:9200
      YAADBUZZ_S3_ENDPOINT: http://minio:9000
      # Browser-facing media URLs (served via nginx → MinIO)
      YAADBUZZ_S3_PUBLIC_ENDPOINT: ${YAADBUZZ_PUBLIC_URL:-https://yaadbuzz.ir}
      YAADBUZZ_S3_ACCESS_KEY: ${YAADBUZZ_S3_ACCESS_KEY:-yaadbuzz}
      YAADBUZZ_S3_SECRET_KEY: ${YAADBUZZ_S3_SECRET_KEY:-yaadbuzzsecret}
      YAADBUZZ_S3_BUCKET: yaadbuzz
      YAADBUZZ_PUBLIC_URL: ${YAADBUZZ_PUBLIC_URL:-https://yaadbuzz.ir}
      YAADBUZZ_SOURCE_URL: ${YAADBUZZ_SOURCE_URL:-https://github.com/hosseinmp76/yaadbuzz}
      YAADBUZZ_JWT_REFRESH_PEPPER: ${YAADBUZZ_JWT_REFRESH_PEPPER:-}
      # Mock mail until real SMTP is configured (empty host previously broke startup)
      YAADBUZZ_MAIL_MOCK: ${YAADBUZZ_MAIL_MOCK:-true}
      YAADBUZZ_MAIL_HOST: ${YAADBUZZ_MAIL_HOST:-localhost}
      YAADBUZZ_MAIL_PORT: ${YAADBUZZ_MAIL_PORT:-1025}
      YAADBUZZ_MAIL_USERNAME: ${YAADBUZZ_MAIL_USERNAME:-}
      YAADBUZZ_MAIL_PASSWORD: ${YAADBUZZ_MAIL_PASSWORD:-}
      YAADBUZZ_MAIL_FROM: ${YAADBUZZ_MAIL_FROM:-Yaadbuzz <noreply@yaadbuzz.ir>}
      YAADBUZZ_MAIL_START_TLS: ${YAADBUZZ_MAIL_START_TLS:-OPTIONAL}
      YAADBUZZ_OAUTH_GOOGLE_ENABLED: ${YAADBUZZ_OAUTH_GOOGLE_ENABLED:-false}
      YAADBUZZ_OAUTH_GOOGLE_CLIENT_ID: ${YAADBUZZ_OAUTH_GOOGLE_CLIENT_ID:-}
      YAADBUZZ_OAUTH_GOOGLE_CLIENT_SECRET: ${YAADBUZZ_OAUTH_GOOGLE_CLIENT_SECRET:-}
      YAADBUZZ_OAUTH_GITHUB_ENABLED: ${YAADBUZZ_OAUTH_GITHUB_ENABLED:-false}
      YAADBUZZ_OAUTH_GITHUB_CLIENT_ID: ${YAADBUZZ_OAUTH_GITHUB_CLIENT_ID:-}
      YAADBUZZ_OAUTH_GITHUB_CLIENT_SECRET: ${YAADBUZZ_OAUTH_GITHUB_CLIENT_SECRET:-}
      YAADBUZZ_OAUTH_TELEGRAM_ENABLED: ${YAADBUZZ_OAUTH_TELEGRAM_ENABLED:-false}
      YAADBUZZ_OAUTH_TELEGRAM_CLIENT_ID: ${YAADBUZZ_OAUTH_TELEGRAM_CLIENT_ID:-}
      YAADBUZZ_OAUTH_TELEGRAM_CLIENT_SECRET: ${YAADBUZZ_OAUTH_TELEGRAM_CLIENT_SECRET:-}
      QUARKUS_LOG_SENTRY_ENABLED: ${QUARKUS_LOG_SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    expose:
      - "8080"
    healthcheck:
      # TCP-only so old and new images both pass (does not require /q/health)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    depends_on:
      app:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped

  # BI dashboard — bound to loopback only (not on the public interface / nginx).
  # On your laptop: ssh -L 3000:127.0.0.1:3000 user@server  →  http://localhost:3000
  # Metabase app DB: Postgres database `metabase` as user METABASE_DB_USER (not the app role).
  # For analytics in the UI, add a separate connection to database `yaadbuzz`.
  metabase-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-yaadbuzz}
      PGPASSWORD: ${POSTGRES_PASSWORD:-yaadbuzz}
      PGDATABASE: yaadbuzz
      METABASE_DB_USER: ${METABASE_DB_USER:-metabase}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:-metabase}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        psql -v ON_ERROR_STOP=1 \
          -v mb_user="$${METABASE_DB_USER}" \
          -v mb_pass="$${METABASE_DB_PASSWORD}" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'mb_user', :'mb_pass')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'mb_user')\gexec

        SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'mb_user', :'mb_pass')
        WHERE EXISTS (SELECT FROM pg_roles WHERE rolname = :'mb_user')\gexec

        SELECT format('CREATE DATABASE metabase OWNER %I', :'mb_user')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'metabase')\gexec

        GRANT ALL PRIVILEGES ON DATABASE metabase TO :"mb_user";
        SQL
        psql -v ON_ERROR_STOP=1 -d metabase -v mb_user="$${METABASE_DB_USER}" <<'SQL'
        GRANT ALL ON SCHEMA public TO :"mb_user";
        ALTER SCHEMA public OWNER TO :"mb_user";
        SQL
    restart: "no"

  metabase:
    image: metabase/metabase:v0.56.5.x
    depends_on:
      postgres:
        condition: service_healthy
      metabase-db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER:-metabase}
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase}
      MB_DB_HOST: postgres
      JAVA_TIMEZONE: ${METABASE_TIMEZONE:-Asia/Tehran}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

volumes:
  postgres_data:
  es_data:
  minio_data:
