services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yaadbuzz
      POSTGRES_USER: yaadbuzz
      POSTGRES_PASSWORD: yaadbuzz
    # Localhost-only so `./mvnw quarkus:dev` can connect without exposing DB to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaadbuzz -d yaadbuzz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yaadbuzz
      MINIO_ROOT_PASSWORD: yaadbuzzsecret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 yaadbuzz yaadbuzzsecret;
      mc mb --ignore-existing local/yaadbuzz;
      mc anonymous set download local/yaadbuzz;
      exit 0;
      "

  app:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.compose
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/yaadbuzz
      QUARKUS_DATASOURCE_USERNAME: yaadbuzz
      QUARKUS_DATASOURCE_PASSWORD: yaadbuzz
      QUARKUS_HIBERNATE_SEARCH_ORM_ELASTICSEARCH_HOSTS: elasticsearch:9200
      YAADBUZZ_S3_ENDPOINT: http://minio:9000
      # Browser-facing media URLs (served via nginx → MinIO)
      YAADBUZZ_S3_PUBLIC_ENDPOINT: ${YAADBUZZ_PUBLIC_URL:-https://yaadbuzz.ir}
      YAADBUZZ_S3_ACCESS_KEY: yaadbuzz
      YAADBUZZ_S3_SECRET_KEY: yaadbuzzsecret
      YAADBUZZ_S3_BUCKET: yaadbuzz
      YAADBUZZ_PUBLIC_URL: ${YAADBUZZ_PUBLIC_URL:-https://yaadbuzz.ir}
      YAADBUZZ_SOURCE_URL: ${YAADBUZZ_SOURCE_URL:-https://github.com/hosseinmp76/yaadbuzz}
      YAADBUZZ_MAIL_HOST: ${YAADBUZZ_MAIL_HOST:-}
      YAADBUZZ_MAIL_PORT: ${YAADBUZZ_MAIL_PORT:-587}
      YAADBUZZ_MAIL_USERNAME: ${YAADBUZZ_MAIL_USERNAME:-}
      YAADBUZZ_MAIL_PASSWORD: ${YAADBUZZ_MAIL_PASSWORD:-}
      YAADBUZZ_MAIL_FROM: ${YAADBUZZ_MAIL_FROM:-Yaadbuzz <noreply@yaadbuzz.ir>}
      YAADBUZZ_MAIL_START_TLS: ${YAADBUZZ_MAIL_START_TLS:-REQUIRED}
      QUARKUS_LOG_SENTRY_ENABLED: ${QUARKUS_LOG_SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    depends_on:
      - app
      - minio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  postgres_data:
  es_data:
  minio_data:
