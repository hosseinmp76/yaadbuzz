query Me {
  me {
    id
    email
    displayName
  }
}

mutation UpdateMyProfile($displayName: String!) {
  updateMyProfile(displayName: $displayName) {
    id
    email
    displayName
  }
}

query MyTeamMembership($teamId: String!) {
  myTeamMembership(teamId: $teamId) {
    id
    nickname
    bio
    avatar {
      id
      url
    }
  }
}

query MyOrganizations {
  myOrganizations {
    id
    name
    brandColor
  }
}

query Teams($organizationId: String!) {
  teams(organizationId: $organizationId) {
    id
    name
    brandColor
    revealTributes
    tributesRevealed
  }
}

query Team($id: String!) {
  team(id: $id) {
    id
    organizationId
    name
    brandColor
    revealTributes
    revealAt
    tributesRevealed
    yearbookTitle
    yearbookSubtitle
    yearbookDedication
    yearbookTheme
    yearbookShowMembers
    yearbookShowTributes
    yearbookShowCharacteristics
    yearbookShowMemories
    yearbookShowAwards
  }
}

query TeamMembers($teamId: String!, $first: Int, $after: String, $query: String) {
  teamMembers(teamId: $teamId, first: $first, after: $after, query: $query) {
    items {
      id
      nickname
      bio
      role
      avatar {
        url
      }
    }
    nextCursor
    hasNext
  }
}

query TeamMember($id: String!) {
  teamMember(id: $id) {
    id
    teamId
    nickname
    bio
    role
    avatar {
      url
    }
  }
}

query Tributes($teamId: String!, $recipientId: String, $first: Int, $after: String) {
  tributes(teamId: $teamId, recipientId: $recipientId, first: $first, after: $after) {
    items {
      id
      text
      anonymous
      privateTribute
      createdAt
      writer {
        id
        nickname
      }
      recipient {
        id
        nickname
      }
      pictures {
        id
        url
        mimeType
      }
    }
    nextCursor
    hasNext
  }
}

query Memories($teamId: String!, $first: Int, $after: String) {
  memories(teamId: $teamId, first: $first, after: $after) {
    items {
      id
      title
      bodyText
      privateMemory
      createdAt
      writer {
        id
        nickname
      }
      tagged {
        id
        nickname
      }
      pictures {
        id
        url
        mimeType
      }
    }
    nextCursor
    hasNext
  }
}

query Topics($teamId: String!) {
  topics(teamId: $teamId) {
    id
    title
  }
}

query TopicStandings($topicId: String!) {
  topicStandings(topicId: $topicId) {
    score
    nominee {
      id
      nickname
    }
  }
}

query Characteristics($teamMemberId: String!) {
  characteristics(teamMemberId: $teamMemberId) {
    id
    title
    count
  }
}

query Comments($memoryId: String!) {
  comments(memoryId: $memoryId) {
    id
    memoryId
    text
    createdAt
    writer {
      id
      nickname
    }
  }
}

query Search($teamId: String!, $q: String!, $first: Int, $after: String) {
  search(teamId: $teamId, q: $q, first: $first, after: $after) {
    items {
      type
      id
      title
      snippet
    }
    nextCursor
    hasNext
  }
}

query YearbookExports($teamId: String!) {
  yearbookExports(teamId: $teamId) {
    id
    status
    fileUrl
    errorMessage
    createdAt
    completedAt
  }
}

query Yearbook($teamId: String!) {
  yearbook(teamId: $teamId) {
    teamId
    orgName
    teamName
    title
    subtitle
    dedication
    theme
    brandColor
    logoUrl
    coverMediaUrl
    showMembers
    showTributes
    showCharacteristics
    showMemories
    showAwards
    members {
      nickname
      bio
      avatarUrl
      characteristics {
        title
        count
      }
      tributes {
        text
        writer
      }
    }
    memories {
      title
      body
      writer
      imageUrls
    }
    topics {
      title
      standings {
        nickname
        score
      }
    }
  }
}

mutation UpdateYearbookSettings(
  $teamId: String!
  $title: String
  $subtitle: String
  $dedication: String
  $theme: YearbookTheme
  $showMembers: Boolean
  $showTributes: Boolean
  $showCharacteristics: Boolean
  $showMemories: Boolean
  $showAwards: Boolean
) {
  updateYearbookSettings(
    teamId: $teamId
    title: $title
    subtitle: $subtitle
    dedication: $dedication
    theme: $theme
    showMembers: $showMembers
    showTributes: $showTributes
    showCharacteristics: $showCharacteristics
    showMemories: $showMemories
    showAwards: $showAwards
  ) {
    id
    yearbookTitle
    yearbookSubtitle
    yearbookDedication
    yearbookTheme
    yearbookShowMembers
    yearbookShowTributes
    yearbookShowCharacteristics
    yearbookShowMemories
    yearbookShowAwards
  }
}

mutation CreateOrganization($name: String!, $brandColor: String) {
  createOrganization(name: $name, brandColor: $brandColor) {
    id
    name
  }
}

mutation CreateTeam($organizationId: String!, $name: String!, $brandColor: String) {
  createTeam(organizationId: $organizationId, name: $name, brandColor: $brandColor) {
    id
    name
  }
}

mutation CreateInvite($teamId: String!, $role: TeamRole, $maxUses: Int) {
  createInvite(teamId: $teamId, role: $role, maxUses: $maxUses) {
    id
    code
    role
    maxUses
    email
  }
}

mutation InviteByEmail($teamId: String!, $email: String!, $role: TeamRole) {
  inviteByEmail(teamId: $teamId, email: $email, role: $role) {
    id
    code
    role
    email
    maxUses
  }
}

mutation JoinTeam($code: String!, $nickname: String, $bio: String) {
  joinTeam(code: $code, nickname: $nickname, bio: $bio) {
    id
    teamId
    nickname
  }
}

mutation UpsertProfile($teamId: String!, $nickname: String, $bio: String, $avatarId: String) {
  upsertTeamMemberProfile(teamId: $teamId, nickname: $nickname, bio: $bio, avatarId: $avatarId) {
    id
    nickname
    bio
    avatar {
      url
    }
  }
}

mutation CreateTribute(
  $teamId: String!
  $recipientId: String!
  $text: String!
  $anonymous: Boolean!
  $privateTribute: Boolean!
) {
  createTribute(
    teamId: $teamId
    recipientId: $recipientId
    text: $text
    anonymous: $anonymous
    privateTribute: $privateTribute
  ) {
    id
    text
  }
}

mutation CreateMemory(
  $teamId: String!
  $title: String
  $bodyText: String!
  $privateMemory: Boolean!
  $taggedIds: [String]
  $mediaIds: [String]
) {
  createMemory(
    teamId: $teamId
    title: $title
    bodyText: $bodyText
    privateMemory: $privateMemory
    taggedIds: $taggedIds
    mediaIds: $mediaIds
  ) {
    id
    title
    pictures {
      id
      url
    }
  }
}

mutation CreateTopic($teamId: String!, $title: String!) {
  createTopic(teamId: $teamId, title: $title) {
    id
    title
  }
}

mutation VoteTopic($topicId: String!, $nomineeId: String!, $repetitions: Int) {
  voteTopic(topicId: $topicId, nomineeId: $nomineeId, repetitions: $repetitions)
}

mutation AddCharacteristic($teamMemberId: String!, $title: String!) {
  addCharacteristic(teamMemberId: $teamMemberId, title: $title) {
    id
    title
    count
  }
}

mutation AddComment($memoryId: String!, $text: String!, $parentId: String, $mediaIds: [String]) {
  addComment(memoryId: $memoryId, text: $text, parentId: $parentId, mediaIds: $mediaIds) {
    id
    memoryId
    text
    createdAt
    writer {
      id
      nickname
    }
  }
}

mutation UpdateTeamSettings($teamId: String!, $brandColor: String, $revealTributes: Boolean) {
  updateTeamSettings(teamId: $teamId, brandColor: $brandColor, revealTributes: $revealTributes) {
    id
    revealTributes
    brandColor
  }
}

mutation RequestYearbookExport($teamId: String!) {
  requestYearbookExport(teamId: $teamId) {
    id
    status
  }
}

mutation HideTribute($tributeId: String!) {
  hideTribute(tributeId: $tributeId) {
    id
    hidden
  }
}

mutation ReportTribute($tributeId: String!, $reason: String!) {
  reportTribute(tributeId: $tributeId, reason: $reason)
}
