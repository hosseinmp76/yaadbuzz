type CharacteristicType {
  count: Int!
  id: String
  teamMemberId: String
  title: String
}

type CommentType {
  "ISO-8601"
  createdAt: DateTime
  id: String
  memoryId: String
  text: String
  writer: TeamMemberType
}

type ConnectionMemory {
  hasNext: Boolean!
  items: [MemoryType]
  nextCursor: String
}

type ConnectionSearch {
  hasNext: Boolean!
  items: [SearchHitType]
  nextCursor: String
}

type ConnectionTeamMember {
  hasNext: Boolean!
  items: [TeamMemberType]
  nextCursor: String
}

type ConnectionTribute {
  hasNext: Boolean!
  items: [TributeType]
  nextCursor: String
}

type InviteType {
  code: String
  email: String
  "ISO-8601"
  expiresAt: DateTime
  id: String
  maxUses: Int
  role: TeamRole
  teamId: String
  useCount: Int!
}

type MediaType {
  id: String
  mimeType: String
  url: String
}

type MemoryType {
  bodyText: String
  "ISO-8601"
  createdAt: DateTime
  id: String
  pictures: [MediaType]
  privateMemory: Boolean!
  tagged: [TeamMemberType]
  teamId: String
  title: String
  writer: TeamMemberType
}

"Mutation root"
type Mutation {
  addCharacteristic(teamMemberId: String, title: String): CharacteristicType
  addComment(mediaIds: [String], memoryId: String, parentId: String, text: String): CommentType
  createInvite(
    "ISO-8601"
    expiresAt: DateTime,
    maxUses: Int,
    role: TeamRole,
    teamId: String
  ): InviteType
  createMemory(bodyText: String, mediaIds: [String], privateMemory: Boolean!, taggedIds: [String], teamId: String, title: String): MemoryType
  createOrganization(brandColor: String, name: String): OrganizationType
  createTeam(brandColor: String, name: String, organizationId: String): TeamType
  createTopic(teamId: String, title: String): TopicType
  createTribute(anonymous: Boolean!, privateTribute: Boolean!, recipientId: String, teamId: String, text: String): TributeType
  hideTribute(tributeId: String): TributeType
  inviteByEmail(email: String, role: TeamRole, teamId: String): InviteType
  joinTeam(bio: String, code: String, nickname: String): TeamMemberType
  reportTribute(reason: String, tributeId: String): Boolean
  requestYearbookExport(teamId: String): YearbookExportType
  "Update the current user's display name"
  updateMyProfile(displayName: String): UserType
  updateOrganizationBranding(brandColor: String, id: String, logoId: String): OrganizationType
  updateTeamSettings(
    brandColor: String,
    coverMediaId: String,
    "ISO-8601"
    revealAt: DateTime,
    revealTributes: Boolean,
    teamId: String
  ): TeamType
  "Customize online/print yearbook layout and sections"
  updateYearbookSettings(dedication: String, showAwards: Boolean, showCharacteristics: Boolean, showMembers: Boolean, showMemories: Boolean, showTributes: Boolean, subtitle: String, teamId: String, theme: YearbookTheme, title: String): TeamType
  upsertTeamMemberProfile(avatarId: String, bio: String, nickname: String, teamId: String): TeamMemberType
  voteTopic(nomineeId: String, repetitions: Int, topicId: String): Boolean
}

type OrganizationType {
  brandColor: String
  id: String
  logo: MediaType
  name: String
}

"Query root"
type Query {
  characteristics(teamMemberId: String): [CharacteristicType]
  comments(memoryId: String): [CommentType]
  "Current authenticated user"
  me: UserType
  memories(after: String, first: Int, teamId: String): ConnectionMemory
  myOrganizations: [OrganizationType]
  "Current user's membership in a team"
  myTeamMembership(teamId: String): TeamMemberType
  organization(id: String): OrganizationType
  search(after: String, first: Int, q: String, teamId: String): ConnectionSearch
  team(id: String): TeamType
  teamMember(id: String): TeamMemberType
  teamMembers(after: String, first: Int, query: String, teamId: String): ConnectionTeamMember
  teams(organizationId: String): [TeamType]
  topicStandings(topicId: String): [TopicStandingType]
  topics(teamId: String): [TopicType]
  tributes(after: String, first: Int, recipientId: String, teamId: String): ConnectionTribute
  "Assembled yearbook for online viewing and browser print-to-PDF"
  yearbook(teamId: String): YearbookType
  yearbookExports(teamId: String): [YearbookExportType]
}

type SearchHitType {
  id: String
  snippet: String
  title: String
  type: String
}

type TeamMemberType {
  avatar: MediaType
  bio: String
  id: String
  nickname: String
  role: TeamRole
  teamId: String
  userId: String
}

type TeamType {
  brandColor: String
  coverMedia: MediaType
  id: String
  name: String
  organizationId: String
  "ISO-8601"
  revealAt: DateTime
  revealTributes: Boolean!
  tributesRevealed: Boolean!
  yearbookDedication: String
  yearbookShowAwards: Boolean!
  yearbookShowCharacteristics: Boolean!
  yearbookShowMembers: Boolean!
  yearbookShowMemories: Boolean!
  yearbookShowTributes: Boolean!
  yearbookSubtitle: String
  yearbookTheme: YearbookTheme
  yearbookTitle: String
}

type TopicStandingType {
  nominee: TeamMemberType
  score: Int!
}

type TopicType {
  id: String
  teamId: String
  title: String
}

type TributeType {
  anonymous: Boolean!
  "ISO-8601"
  createdAt: DateTime
  hidden: Boolean!
  id: String
  pictures: [MediaType]
  privateTribute: Boolean!
  recipient: TeamMemberType
  teamId: String
  text: String
  writer: TeamMemberType
}

type UserType {
  displayName: String
  email: String
  id: String
}

type YearbookCharacteristicType {
  count: Int!
  title: String
}

type YearbookExportType {
  "ISO-8601"
  completedAt: DateTime
  "ISO-8601"
  createdAt: DateTime
  errorMessage: String
  fileUrl: String
  id: String
  status: ExportStatus
  teamId: String
}

type YearbookMemberType {
  avatarUrl: String
  bio: String
  characteristics: [YearbookCharacteristicType]
  nickname: String
  tributes: [YearbookTributeType]
}

type YearbookMemoryType {
  body: String
  imageUrls: [String]
  title: String
  writer: String
}

type YearbookStandingType {
  nickname: String
  score: Int!
}

type YearbookTopicType {
  standings: [YearbookStandingType]
  title: String
}

type YearbookTributeType {
  text: String
  writer: String
}

type YearbookType {
  brandColor: String
  coverMediaUrl: String
  dedication: String
  logoUrl: String
  members: [YearbookMemberType]
  memories: [YearbookMemoryType]
  orgName: String
  showAwards: Boolean!
  showCharacteristics: Boolean!
  showMembers: Boolean!
  showMemories: Boolean!
  showTributes: Boolean!
  subtitle: String
  teamId: String
  teamName: String
  theme: YearbookTheme
  title: String
  topics: [YearbookTopicType]
}

enum ExportStatus {
  FAILED
  PENDING
  PROCESSING
  READY
}

enum TeamRole {
  ADMIN
  MEMBER
}

enum YearbookTheme {
  CLASSIC
  MINIMAL
  MODERN
  SCRAPBOOK
}

"Scalar for BigDecimal"
scalar BigDecimal

"Scalar for BigInteger"
scalar BigInteger

"Scalar for DateTime"
scalar DateTime
