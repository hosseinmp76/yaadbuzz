quarkus.application.name=yaadbuzz

# HTTP
quarkus.http.port=8080
quarkus.http.cors.origins=/.*/
quarkus.http.auth.proactive=false

# Datasource (URL is profile-specific so %test can use Dev Services)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:yaadbuzz}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:yaadbuzz}
%dev.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/yaadbuzz}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/yaadbuzz}

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.mapping.format.global=ignore

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# JWT
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.verify.issuer=https://yaadbuzz.local
smallrye.jwt.sign.key.location=jwt/privateKey.pem
smallrye.jwt.new-token.lifespan=3600
yaadbuzz.jwt.refresh-ttl=P7D

# Path security
quarkus.http.auth.permission.public.paths=/api/auth/*,/q/*,/graphql-ui,/graphql-ui/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/media/*,/api/yearbooks/*,/graphql
quarkus.http.auth.permission.authenticated.policy=authenticated

# GraphQL
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.schema-include-scalars=true

# OpenAPI / Swagger
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
mp.openapi.extensions.smallrye.info.title=Yaadbuzz REST API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Binary and auth REST endpoints for Yaadbuzz. App data APIs are GraphQL.

# Hibernate Search / Elasticsearch (hosts profile-specific for Dev Services in tests)
quarkus.hibernate-search-orm.elasticsearch.version=8
quarkus.hibernate-search-orm.elasticsearch.protocol=http
quarkus.hibernate-search-orm.schema-management.strategy=create-or-update
quarkus.hibernate-search-orm.indexing.plan.synchronization.strategy=write-sync
%dev.quarkus.hibernate-search-orm.elasticsearch.hosts=${QUARKUS_HIBERNATE_SEARCH_ORM_ELASTICSEARCH_HOSTS:localhost:9200}
%prod.quarkus.hibernate-search-orm.elasticsearch.hosts=${QUARKUS_HIBERNATE_SEARCH_ORM_ELASTICSEARCH_HOSTS:localhost:9200}

# Quinoa (React)
quarkus.quinoa.ui-root-path=/
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.18.0
quarkus.quinoa.dev-server.port=3000
quarkus.quinoa.enable-spa-routing=true

# S3 / MinIO
yaadbuzz.s3.endpoint=${YAADBUZZ_S3_ENDPOINT:http://localhost:9000}
yaadbuzz.s3.public-endpoint=${YAADBUZZ_S3_PUBLIC_ENDPOINT:http://localhost:9000}
yaadbuzz.s3.access-key=${YAADBUZZ_S3_ACCESS_KEY:yaadbuzz}
yaadbuzz.s3.secret-key=${YAADBUZZ_S3_SECRET_KEY:yaadbuzzsecret}
yaadbuzz.s3.bucket=${YAADBUZZ_S3_BUCKET:yaadbuzz}
yaadbuzz.s3.region=us-east-1

# Dev seed
yaadbuzz.seed.enabled=true
%prod.yaadbuzz.seed.enabled=false

# Container image (quarkus:image-build)
quarkus.container-image.builder=docker
quarkus.container-image.group=yaadbuzz
quarkus.container-image.name=yaadbuzz
quarkus.container-image.tag=1.0.0-SNAPSHOT
quarkus.docker.dockerfile-jvm-path=src/main/docker/Dockerfile.jvm
quarkus.docker.dockerfile-native-path=src/main/docker/Dockerfile.native

# Native (activated by -Dnative / native Maven profile)
quarkus.native.container-build=true
quarkus.native.additional-build-args=\
  --initialize-at-run-time=org.apache.commons.logging.impl.Log4JLogger,\
  --initialize-at-build-time=org.apache.commons.logging.LogFactory,\
  --initialize-at-build-time=org.apache.commons.logging.impl.JBossLogFactory

# --- test profile ---
%test.yaadbuzz.seed.enabled=false
%test.quarkus.quinoa.enabled=false
%test.quarkus.scheduler.enabled=false
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.elasticsearch.devservices.enabled=true
%test.quarkus.elasticsearch.devservices.image-name=docker.elastic.co/elasticsearch/elasticsearch:8.15.5
%test.quarkus.hibernate-search-orm.elasticsearch.version=8
%test.quarkus.http.port=0
%test.quarkus.hibernate-orm.log.sql=false
