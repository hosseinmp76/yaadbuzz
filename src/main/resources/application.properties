quarkus.application.name=yaadbuzz

# HTTP
quarkus.http.port=8080
quarkus.http.cors.origins=/.*/
quarkus.http.auth.proactive=false

# Datasource (URL is profile-specific so %test can use Dev Services)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:yaadbuzz}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:yaadbuzz}
%dev.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/yaadbuzz}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/yaadbuzz}

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.mapping.format.global=ignore

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# JWT
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.verify.issuer=https://yaadbuzz.local
smallrye.jwt.sign.key.location=jwt/privateKey.pem
smallrye.jwt.new-token.lifespan=3600
yaadbuzz.jwt.refresh-ttl=P7D

# Trust nginx/Cloudflare X-Forwarded-* so OIDC redirect_uri uses https://yaadbuzz.ir (not http://).
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true

# Social login (Google / GitHub / Telegram OIDC). Off until YAADBUZZ_OAUTH_*_ENABLED=true.
yaadbuzz.oauth.google.enabled=${YAADBUZZ_OAUTH_GOOGLE_ENABLED:false}
yaadbuzz.oauth.github.enabled=${YAADBUZZ_OAUTH_GITHUB_ENABLED:false}
yaadbuzz.oauth.telegram.enabled=${YAADBUZZ_OAUTH_TELEGRAM_ENABLED:false}
quarkus.oidc.tenant-enabled=false
quarkus.oidc.google.tenant-enabled=${yaadbuzz.oauth.google.enabled}
quarkus.oidc.google.provider=google
quarkus.oidc.google.application-type=web-app
quarkus.oidc.google.client-id=${YAADBUZZ_OAUTH_GOOGLE_CLIENT_ID:}
quarkus.oidc.google.credentials.secret=${YAADBUZZ_OAUTH_GOOGLE_CLIENT_SECRET:}
quarkus.oidc.google.authentication.redirect-path=/api/auth/oauth/google
quarkus.oidc.google.authentication.restore-path-after-redirect=true
%prod.quarkus.oidc.google.authentication.force-redirect-https-scheme=true
quarkus.oidc.github.tenant-enabled=${yaadbuzz.oauth.github.enabled}
quarkus.oidc.github.provider=github
quarkus.oidc.github.application-type=web-app
quarkus.oidc.github.client-id=${YAADBUZZ_OAUTH_GITHUB_CLIENT_ID:}
quarkus.oidc.github.credentials.secret=${YAADBUZZ_OAUTH_GITHUB_CLIENT_SECRET:}
quarkus.oidc.github.authentication.redirect-path=/api/auth/oauth/github
quarkus.oidc.github.authentication.restore-path-after-redirect=true
%prod.quarkus.oidc.github.authentication.force-redirect-https-scheme=true
quarkus.oidc.github.authentication.scopes=user:email,read:user
# Telegram OpenID Connect — https://oauth.telegram.org/.well-known/openid-configuration
# Client ID = BotFather Web Login Client ID (bot numeric id); Secret = Web Login Client Secret (not bot token).
quarkus.oidc.telegram.tenant-enabled=${yaadbuzz.oauth.telegram.enabled}
quarkus.oidc.telegram.auth-server-url=https://oauth.telegram.org
quarkus.oidc.telegram.application-type=web-app
quarkus.oidc.telegram.client-id=${YAADBUZZ_OAUTH_TELEGRAM_CLIENT_ID:}
quarkus.oidc.telegram.credentials.secret=${YAADBUZZ_OAUTH_TELEGRAM_CLIENT_SECRET:}
quarkus.oidc.telegram.authentication.redirect-path=/api/auth/oauth/telegram
quarkus.oidc.telegram.authentication.restore-path-after-redirect=true
%prod.quarkus.oidc.telegram.authentication.force-redirect-https-scheme=true
quarkus.oidc.telegram.authentication.scopes=openid,profile
quarkus.oidc.telegram.authentication.pkce-required=true
# Telegram has no UserInfo endpoint; identity is in the ID token.
quarkus.oidc.telegram.authentication.user-info-required=false

# Path security (more specific paths first)
quarkus.http.auth.permission.oauth-login.paths=/api/auth/oauth/google,/api/auth/oauth/github,/api/auth/oauth/telegram
quarkus.http.auth.permission.oauth-login.policy=authenticated
quarkus.http.auth.permission.change-password.paths=/api/auth/change-password
quarkus.http.auth.permission.change-password.policy=authenticated
quarkus.http.auth.permission.yearbook-share.paths=/api/yearbooks/share/*
quarkus.http.auth.permission.yearbook-share.policy=permit
quarkus.http.auth.permission.seo.paths=/sitemap.xml,/robots.txt,/auth.md,/.well-known/*
quarkus.http.auth.permission.seo.policy=permit
quarkus.http.auth.permission.public.paths=/api/auth/*,/api/auth/oauth/providers,/api/auth/oauth/exchange,/api/source,/api/source/*,/q/*,/graphql-ui,/graphql-ui/*,/graphql
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/media/*,/api/yearbooks/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Health (used by docker compose healthcheck)
quarkus.smallrye-health.root-path=/q/health

# Mailer
quarkus.mailer.from=${YAADBUZZ_MAIL_FROM:Yaadbuzz <noreply@yaadbuzz.ir>}
quarkus.mailer.host=${YAADBUZZ_MAIL_HOST:localhost}
quarkus.mailer.port=${YAADBUZZ_MAIL_PORT:1025}
quarkus.mailer.username=${YAADBUZZ_MAIL_USERNAME:}
quarkus.mailer.password=${YAADBUZZ_MAIL_PASSWORD:}
quarkus.mailer.start-tls=${YAADBUZZ_MAIL_START_TLS:OPTIONAL}
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true
%prod.quarkus.mailer.mock=${YAADBUZZ_MAIL_MOCK:false}
yaadbuzz.mail.from=${YAADBUZZ_MAIL_FROM:Yaadbuzz <noreply@yaadbuzz.ir>}
yaadbuzz.public-url=${YAADBUZZ_PUBLIC_URL:http://localhost:8080}
yaadbuzz.source-url=${YAADBUZZ_SOURCE_URL:https://github.com/hosseinmp76/yaadbuzz}
yaadbuzz.password-reset.ttl=PT1H
yaadbuzz.rate-limit.auth.max=20
yaadbuzz.rate-limit.auth.window-seconds=60

# Sentry (disabled unless QUARKUS_LOG_SENTRY_ENABLED=true and DSN is set)
quarkus.log.sentry.enabled=${QUARKUS_LOG_SENTRY_ENABLED:false}
quarkus.log.sentry.dsn=${SENTRY_DSN:}
quarkus.log.sentry.environment=${SENTRY_ENVIRONMENT:production}
quarkus.log.sentry.in-app-packages=com.yaadbuzz
%dev.quarkus.log.sentry.enabled=false
%test.quarkus.log.sentry.enabled=false

# GraphQL
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.ui.root-path=/graphql-ui
quarkus.smallrye-graphql.schema-include-scalars=true
# Default depth is 10; GraphiQL introspection is ~15 deep.
quarkus.smallrye-graphql.instrumentation-query-depth=20
# Auth is enforced on resolvers via @RolesAllowed("user"); GraphiQL needs a Bearer JWT in Headers.

# OpenAPI / Swagger
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
mp.openapi.extensions.smallrye.info.title=Yaadbuzz REST API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Binary and auth REST endpoints for Yaadbuzz. App data APIs are GraphQL.

# Hibernate Search / Elasticsearch (hosts profile-specific for Dev Services in tests)
quarkus.hibernate-search-orm.elasticsearch.version=8
quarkus.hibernate-search-orm.elasticsearch.protocol=http
quarkus.hibernate-search-orm.schema-management.strategy=create-or-update
quarkus.hibernate-search-orm.indexing.plan.synchronization.strategy=write-sync
%dev.quarkus.hibernate-search-orm.elasticsearch.hosts=${QUARKUS_HIBERNATE_SEARCH_ORM_ELASTICSEARCH_HOSTS:localhost:9200}
%prod.quarkus.hibernate-search-orm.elasticsearch.hosts=${QUARKUS_HIBERNATE_SEARCH_ORM_ELASTICSEARCH_HOSTS:localhost:9200}

# Quinoa (React)
quarkus.quinoa.ui-root-path=/
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.18.0
quarkus.quinoa.dev-server.host=127.0.0.1
quarkus.quinoa.dev-server.port=3000
quarkus.quinoa.dev-server.direct-forwarding=true
# Avoid Quinoa HMR websocket proxy races ("WebSocket is closed" on Vert.x).
# Vite HMR connects directly to 127.0.0.1:3000 (see vite.config.ts).
%dev.quarkus.quinoa.dev-server.websocket=false
quarkus.quinoa.enable-spa-routing=true
# Do not SPA-fallback /assets/* — missing hashed files must 404 (not index.html as text/css).
# Otherwise Google/CDN-cached HTML pointing at an old hash loads unstyled until hard refresh.
quarkus.quinoa.ignored-path-prefixes=/api,/graphql,/graphql-ui,/q,/.well-known,/auth.md,/sitemap.xml,/robots.txt,/assets

# HTML/SPA shells: always revalidate (prevents stale index → dead asset hashes from search/CDN).
quarkus.http.filter.html.header.Cache-Control=no-cache, must-revalidate
quarkus.http.filter.html.matches=/|/index\\.html|/about|/login|/register|/app|/source|/oauth/.*|/teams/.*|/orgs/.*|/join/.*|/preferences|/forgot-password|/reset-password
quarkus.http.filter.html.methods=GET,HEAD
quarkus.http.filter.html.order=1
# Fingerprinted Vite assets: cache forever (filename changes on each build).
quarkus.http.filter.assets.header.Cache-Control=public, max-age=31536000, immutable
quarkus.http.filter.assets.matches=/assets/.+
quarkus.http.filter.assets.methods=GET,HEAD
quarkus.http.filter.assets.order=2

# S3 / MinIO
yaadbuzz.s3.endpoint=${YAADBUZZ_S3_ENDPOINT:http://localhost:9000}
yaadbuzz.s3.public-endpoint=${YAADBUZZ_S3_PUBLIC_ENDPOINT:http://localhost:9000}
yaadbuzz.s3.access-key=${YAADBUZZ_S3_ACCESS_KEY:yaadbuzz}
yaadbuzz.s3.secret-key=${YAADBUZZ_S3_SECRET_KEY:yaadbuzzsecret}
yaadbuzz.s3.bucket=${YAADBUZZ_S3_BUCKET:yaadbuzz}
yaadbuzz.s3.region=us-east-1

# Dev seed
yaadbuzz.seed.enabled=true
%prod.yaadbuzz.seed.enabled=false

# Container image (quarkus:image-build)
quarkus.container-image.builder=docker
quarkus.container-image.group=yaadbuzz
quarkus.container-image.name=yaadbuzz
quarkus.container-image.tag=1.0.0-SNAPSHOT
quarkus.docker.dockerfile-jvm-path=src/main/docker/Dockerfile.jvm
quarkus.docker.dockerfile-native-path=src/main/docker/Dockerfile.native

# Native (activated by -Dnative / native Maven profile)
quarkus.native.container-build=true
quarkus.native.additional-build-args=\
  --initialize-at-run-time=org.apache.commons.logging.impl.Log4JLogger,\
  --initialize-at-build-time=org.apache.commons.logging.LogFactory,\
  --initialize-at-build-time=org.apache.commons.logging.impl.JBossLogFactory

# --- test profile ---
%test.yaadbuzz.seed.enabled=false
%test.quarkus.quinoa.enabled=false
%test.quarkus.scheduler.enabled=false
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.elasticsearch.devservices.enabled=true
%test.quarkus.elasticsearch.devservices.image-name=docker.elastic.co/elasticsearch/elasticsearch:8.15.5
%test.quarkus.hibernate-search-orm.elasticsearch.version=8
%test.quarkus.http.port=0
%test.quarkus.hibernate-orm.log.sql=false

%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true
%test.yaadbuzz.rate-limit.auth.max=1000
