<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Set your Yaadbuzz password</title>
</head>
<body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #1c1917;">
  <p>Hi {displayName},</p>
  <p>Welcome to Yaadbuzz. Use the button below to set your password and finish creating your account (valid for a limited time):</p>
  <p>
    <a href="{setupUrl}" style="display:inline-block;background:#0f766e;color:#fff;padding:12px 18px;border-radius:999px;text-decoration:none;font-weight:700;">
      Set password
    </a>
  </p>
  <p style="color:#57534e;font-size:14px;">Or copy this link:<br/>{setupUrl}</p>
  <p style="color:#57534e;font-size:14px;">If you did not request this, you can ignore this email.</p>
  <p style="color:#57534e;font-size:12px;"><a href="{publicUrl}">Yaadbuzz</a></p>
</body>
</html>
